name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install ".[gui,dev]" pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Smoke test the built program
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\VoxCommand\voxcommand-cli.exe"
          & $exe --version
          & $exe check -p voxcommand\example_profile.yaml
          if ($LASTEXITCODE) { throw "check failed" }
          & $exe simulate -p voxcommand\example_profile.yaml "gear up"
          # Spoken phrases from the Windows voice, through the bundled Whisper
          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          foreach ($phrase in "landing gear", "what time is it") {
            $synth.SetOutputToWaveFile("$PWD\$($phrase -replace ' ', '_').wav")
            $synth.Speak($phrase)
          }
          $synth.SetOutputToNull()
          & $exe transcribe -p voxcommand\example_profile.yaml landing_gear.wav what_time_is_it.wav
          if ($LASTEXITCODE) { throw "transcription did not match" }
          # A Piper voice, synthesized by the bundled Piper and heard back by Whisper
          $voices = "$env:LOCALAPPDATA\VoxCommand\voices"
          New-Item -ItemType Directory -Force $voices | Out-Null
          $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/low/en_US-amy-low.onnx"
          Invoke-WebRequest "$base`?download=true" -OutFile "$voices\en_US-amy-low.onnx"
          Invoke-WebRequest "$base.json?download=true" -OutFile "$voices\en_US-amy-low.onnx.json"
          & $exe say --engine piper --voice en_US-amy-low --wav piper.wav "landing gear"
          if ($LASTEXITCODE) { throw "piper failed" }
          & $exe transcribe -p voxcommand\example_profile.yaml piper.wav
          if ($LASTEXITCODE) { throw "piper speech did not match" }
          # The Windows (SAPI) voice through VoxCommand, saved to a file (the runner has no speakers)
          & $exe say --engine system --voice "Microsoft Zira Desktop - English (United States)" --wav sapi.wav "gear up"
          if ($LASTEXITCODE) { throw "SAPI speech failed" }
          & $exe transcribe -p voxcommand\example_profile.yaml sapi.wav
          if ($LASTEXITCODE) { throw "SAPI speech did not match" }

      - name: Start the GUI and take a screenshot
        shell: pwsh
        run: |
          $p = Start-Process dist\VoxCommand\VoxCommand.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "VoxCommand.exe exited with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\gui.png")
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v4
        with:
          name: VoxCommand-windows
          path: dist/VoxCommand-*-windows-x64.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: gui.png
