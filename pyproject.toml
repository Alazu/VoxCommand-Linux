[project]
name = "voxcommand"
version = "0.1.0"
description = "Open-source voice command macros for Linux (a VoiceAttack alternative) powered by Whisper"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "faster-whisper>=1.1",
    "sounddevice>=0.4",
    "numpy",
    "evdev>=1.7",
    "rapidfuzz>=3",
    "pyyaml>=6",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
# CUDA runtime libraries for NVIDIA GPUs (the driver itself must already be installed)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
gui = ["PySide6-Essentials>=6.6"]
dev = ["pytest"]

[project.scripts]
voxcommand = "voxcommand.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
